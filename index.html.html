<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FundNest - Where Social Ideas Find Their Home</title>
    <style>
        :root {
            --primary-color: #4f46e5;
            --secondary-color: #10b981;
            --background-color: #f9fafb;
            --card-color: #ffffff;
            --text-color: #1f2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--background-color); color: var(--text-color); line-height: 1.6; }
        
        header { background-color: #ffffff; border-bottom: 1px solid #e5e7eb; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        header h1 { color: var(--primary-color); font-size: 1.5rem; font-weight: bold; }
        
        .container { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }

        /* Project Form Section */
        .form-section { background: var(--card-color); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); height: fit-content; }
        .form-section h2 { margin-bottom: 1.5rem; font-size: 1.25rem; color: #374151; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; font-size: 0.9rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; }
        .form-group textarea { resize: vertical; height: 100px; }
        
        .btn { display: inline-block; background-color: var(--primary-color); color: white; padding: 0.75rem 1.5rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; text-align: center; }
        .btn:hover { background-color: #4338ca; }

        /* Project List Section */
        .list-section h2 { margin-bottom: 1.5rem; font-size: 1.25rem; }
        .project-grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
        
        /* Project Card Style */
        .project-card { background: var(--card-color); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border: 1px solid #e5e7eb; }
        .project-badge { display: inline-block; background: #eef2ff; color: var(--primary-color); padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.5rem; }
        .project-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.5rem; }
        .project-creator { font-size: 0.85rem; color: #6b7280; margin-bottom: 1rem; }
        .project-desc { font-size: 0.95rem; color: #4b5563; margin-bottom: 1.5rem; }
        
        /* Progress Bar */
        .progress-container { margin-bottom: 1rem; }
        .progress-bar-bg { background: #e5e7eb; height: 8px; border-radius: 4px; overflow: hidden; margin-bottom: 0.5rem; }
        .progress-bar-fill { background: var(--secondary-color); height: 100%; width: 0%; transition: width 0.3s ease; }
        .progress-stats { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; }

        .donate-box { display: flex; gap: 0.5rem; margin-top: 1rem; }
        .donate-input { width: 60%; padding: 0.5rem; border: 1px solid #d1d5db; border-radius: 6px; }
        .donate-btn { width: 40%; background-color: var(--secondary-color); padding: 0.5rem; font-size: 0.9rem; }
        .donate-btn:hover { background-color: #059669; }
    </style>
</head>
<body>

    <header>
        <h1>FundNest</h1>
        <span style="font-size: 0.9rem; color: #6b7280; font-weight: 500;">A Crowdfunding Platform for Emerging Inventors</span>
    </header>

    <div class="container">
        <!-- 1. Submit Project Form -->
        <section class="form-section">
            <h2>Launch Your Idea</h2>
            <form id="projectForm">
                <div class="form-group">
                    <label for="creator">Creator / Team Name</label>
                    <input type="text" id="creator" placeholder="e.g., Social Venture Oasis" required>
                </div>
                <div class="form-group">
                    <label for="title">Project Title</label>
                    <input type="text" id="title" placeholder="What is your amazing invention?" required>
                </div>
                <div class="form-group">
                    <label for="description">Project Description & Social Impact</label>
                    <textarea id="description" placeholder="Describe how your idea will bring positive changes to society." required></textarea>
                </div>
                <div class="form-group">
                    <label for="goal">Target Goal ($)</label>
                    <input type="number" id="goal" placeholder="Enter target goal amount" min="1" required>
                </div>
                <button type="submit" class="btn">Build a Nest for Idea</button>
            </form>
        </section>

        <!-- 2. Discovery System (Project Feed) -->
        <section class="list-section">
            <h2>Explore Active Ideas</h2>
            <div class="project-grid" id="projectGrid">
                <!-- Project cards will be injected here via JavaScript -->
            </div>
        </section>
    </div>

    <script>
        // Initial Demo Data in English
        let projects = [
            {
                id: 1,
                creator: "Minji Kim (Student Inventor)",
                title: "Haptic-Based Smart Wearable Compass for the Visually Impaired",
                description: "An open-source hardware project designed to improve upon inconvenient voice guidance systems, helping users intuitively perceive directions and obstacles through subtle vibration patterns.",
                goal: 3000,
                current: 1250
            },
            {
                id: 2,
                creator: "Team Kookhee (Design Alliance)",
                title: "Upcycled Modular Furniture from Wasted Plastic Bottle Caps",
                description: "We create unique, one-of-a-kind daily furniture by leveraging irregular aesthetics. A portion of the proceeds will be reinvested into local community environmental cleanups.",
                goal: 1500,
                current: 1500
            }
        ];

        const projectGrid = document.getElementById('projectGrid');
        const projectForm = document.getElementById('projectForm');

        // Function to render projects on the screen
        function renderProjects() {
            projectGrid.innerHTML = '';
            
            projects.forEach(project => {
                const percent = Math.min(Math.round((project.current / project.goal) * 100), 100);
                
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `
                    <span class="project-badge">Student & Creator Support</span>
                    <h3 class="project-title">${project.title}</h3>
                    <p class="project-creator">By ${project.creator}</p>
                    <p class="project-desc">${project.description}</p>
                    
                    <div class="progress-container">
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${percent}%"></div>
                        </div>
                        <div class="progress-stats">
                            <span>${percent}% Funded</span>
                            <span>$${project.current.toLocaleString()} / $${project.goal.toLocaleString()}</span>
                        </div>
                    </div>

                    <div class="donate-box">
                        <input type="number" class="donate-input" id="amount-${project.id}" placeholder="Amount" min="1">
                        <button class="btn donate-btn" onclick="donate(${project.id})">Support</button>
                    </div>
                `;
                projectGrid.appendChild(card);
            });
        }

        // Event listener for submitting a new project
        projectForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newProject = {
                id: Date.now(),
                creator: document.getElementById('creator').value,
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                goal: parseInt(document.getElementById('goal').value),
                current: 0
            };

            projects.unshift(newProject); // Add to the top of the feed
            renderProjects();
            projectForm.reset(); // Reset form
        });

        // Mock Donation Functionality
        window.donate = function(id) {
            const inputField = document.getElementById(`amount-${id}`);
            const amount = parseInt(inputField.value);

            if (isNaN(amount) || amount <= 0) {
                alert('Please enter a valid donation amount.');
                return;
            }

            const project = projects.find(p => p.id === id);
            if (project) {
                project.current += amount;
                alert(`Thank you for your warm support!\n$${amount.toLocaleString()} has been donated to "${project.title}".`);
                renderProjects();
            }
        };

        // Initialize App
        renderProjects();
    </script>
</body>
</html>
